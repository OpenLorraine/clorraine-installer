name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate installer metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --noout config/config.xml packages/*/meta/package.xml

      - name: Test the build tool
        run: |
          python -m py_compile tools/build_installer.py
          python -m unittest discover -s tools/tests -t . -v

  online-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt Installer Framework
        run: |
          python -m pip install --quiet aqtinstall
          python -m aqt install-tool linux desktop tools_ifw -O "$RUNNER_TEMP/qtifw"
          BINARYCREATOR=$(find "$RUNNER_TEMP/qtifw" -type f -name binarycreator | head -1)
          echo "QTIFW_DIR=$(dirname "$(dirname "$BINARYCREATOR")")" >> "$GITHUB_ENV"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 \
            libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 \
            libxcb-shm0 libxcb-glx0 libxcb-xinerama0

      - name: Check QtIFW libraries
        run: |
          if ldd "$QTIFW_DIR/bin/binarycreator" | grep -q "not found"; then
            ldd "$QTIFW_DIR/bin/binarycreator" | grep "not found"
            exit 1
          fi

      - name: Smoke test the online install
        run: tools/smoke-online-install.sh
